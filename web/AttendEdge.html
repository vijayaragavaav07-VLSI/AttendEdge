<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AttendEdge · Smart Attendance Management</title>
<meta name="description" content="AttendEdge: faculty-only attendance dashboard prototype (simulated data, simulated scanner).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23505BD4'/%3E%3Cpath d='M11 21l6 6 12-13' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --side:#F1EEE8; --side-active:#E6E2D9; --card:#FFFFFF; --line:#E6E1D8; --line-strong:#D3CCBE;
  --ink:#1B2340; --muted:#5C6178; --primary:#505BD4; --primary-dark:#3F49B8; --primary-soft:#ECEDFB;
  --ok:#12805C; --ok-soft:#E2F3EB; --warn:#B45309; --warn-soft:#FDEBD9; --bad:#B42318; --bad-soft:#FDE7E4;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(27,35,64,.04),0 3px 10px rgba(27,35,64,.04);
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.mono,.label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 auto}
.stack>*+*{margin-top:12px}
/* shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:40;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{display:block;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.logo{width:36px;height:36px;flex:none}
.sidebar hr{border:0;border-top:1px solid var(--line-strong);margin:18px 6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px}
.nav a svg{color:var(--primary);flex:none}
.nav a:hover{background:rgba(80,91,212,.07)}
.nav a[aria-current=page]{background:var(--side-active);font-weight:650}
.side-foot{margin-top:auto;padding-top:18px}
.profile{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:grid;place-items:center;font-weight:700;flex:none}
.profile b{display:block;font-size:14px;line-height:1.2}
.profile span{font-size:12px;color:var(--muted)}
.shell{margin-left:248px;min-height:100vh}
.scrim{display:none}
.topbar-m{display:none}
main{padding:0 32px 48px;max-width:1280px}
.page-head{padding:28px 0 20px;display:flex;gap:20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.page-head h1{font-size:28px;letter-spacing:-.02em;line-height:1.2;margin:6px 0 8px}
.head-ctl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.head-ctl .field{min-width:150px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);background:#fff;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.ok{background:var(--ok)} .dot.off{background:#9A9DAE} .dot.bad{background:var(--bad)}
/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-size:17px;letter-spacing:-.01em}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.kpi{padding:16px 18px;border-radius:12px;box-shadow:none}
.kpi .v{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.c-primary{color:var(--primary)} .c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}
.g2{grid-template-columns:1.5fr 1fr} .g2e{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.daily-grid{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.sticky{position:sticky;top:16px}
.banner{background:var(--primary);color:#fff;border-radius:var(--radius);padding:18px 22px;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.banner h2{font-size:19px}
.banner p{margin-top:4px;font-size:14.5px}
.banner .chip{display:inline-block;margin-top:10px;background:rgba(27,35,64,.28);border-radius:999px;padding:3px 11px;font-size:12.5px}
.banner .state{display:inline-block;margin-left:10px;font-size:12px;font-weight:700;background:#fff;color:var(--primary-dark);border-radius:999px;padding:2px 10px;vertical-align:middle}
.banner .state.open{color:var(--ok)} .banner .state.nonworking{color:var(--muted)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:#F6F4EF;border-color:#BDB5A4}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-white{background:#fff;color:var(--primary-dark);border-color:#fff}
.btn-white:hover{background:#F0F1FF}
.btn-danger{color:var(--bad);border-color:#EBC3BE}
.btn-danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger-solid:hover{background:#8F1C13}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--primary-dark)}
.icon-btn:hover{background:var(--primary-soft);border-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.field>.label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,.select{width:100%;border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:9px 12px;min-height:40px}
.input:hover,.select:hover{border-color:#B3AB9A}
.input[aria-invalid=true]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.hint{font-size:12.5px;color:var(--muted)}
.search{position:relative;min-width:220px;flex:1 1 220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:36px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.seg button:not([aria-pressed=true]):hover{background:var(--primary-soft)}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:4px 10px;font:600 12px var(--mono);cursor:pointer}
.chip-btn:hover{background:var(--primary-soft);border-color:var(--primary)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:650;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:#0B6446} .badge.warn{background:var(--warn-soft);color:#9A4508}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--primary-soft);color:var(--primary-dark)}
.badge.muted{background:#EFECE6;color:var(--muted)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#FCFBF9;font-weight:600;color:var(--muted);font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FCFBF8}
tr.flash td{background:var(--ok-soft);animation:fl 2.2s ease-out forwards}
@keyframes fl{to{background:transparent}}
tr.dim td{color:var(--muted);background:#FBFAF7}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.th-btn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.th-btn:hover{color:var(--ink)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;font-size:13px;color:var(--muted)}
.rollc{font-family:var(--mono);font-size:13px;font-weight:600}
.bar{height:8px;background:#EFECE6;border-radius:99px;min-width:90px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar span.warn{background:#D98324}
.barcell{display:flex;gap:10px;align-items:center}
.barcell .bar{flex:1}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted);background:#FCFBF9}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* list rows */
.list>*{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick a,.quick button{justify-content:flex-start}
/* scanner */
.sim-tag{font:700 10.5px var(--mono);letter-spacing:.06em;background:var(--warn-soft);color:#9A4508;border-radius:6px;padding:3px 7px;text-transform:uppercase}
.scan-state{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:#FCFBF9}
.scan-state.ok{background:var(--ok-soft);border-color:#B8DFCD}.scan-state.warn{background:var(--warn-soft);border-color:#F1CBA3}
.scan-state.bad{background:var(--bad-soft);border-color:#F0BDB7}.scan-state.info{background:var(--primary-soft);border-color:#CBCEF3}
.scan-state b{display:block;font-size:15.5px}
.bitbox{display:flex;align-items:center;gap:12px}
.bit{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font:700 26px var(--mono);border:2px solid var(--line-strong);background:#fff;color:var(--muted)}
.bit.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bit-arrow{color:var(--muted)}
.regs{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.reg{aspect-ratio:1;border-radius:5px;border:1px solid var(--line-strong);background:#fff;font:600 9.5px var(--mono);color:var(--muted);cursor:pointer;padding:0;display:grid;place-items:center}
.reg.on{background:var(--ok);border-color:var(--ok);color:#fff}
.reg.h{border-bottom:3px solid var(--primary)}
.reg.sel{outline:2px solid var(--primary);outline-offset:1px}
.log li{display:flex;gap:8px;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);list-style:none}
.log{margin:0;padding:0}
/* charts */
.chart{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}.c-axis{fill:var(--muted);font:10px var(--mono)}
.c-bar{fill:var(--primary)}.c-bar.low{fill:#D98324}.c-line{stroke:var(--primary);fill:none;stroke-width:2.2;stroke-linejoin:round}.c-dot{fill:var(--primary)}
.c-area{fill:var(--primary);opacity:.08}
/* flow */
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.node{flex:1 1 130px;border:1px solid var(--line-strong);border-radius:12px;padding:12px;background:#fff;min-width:130px}
.node b{display:block;font-size:13.5px}.node span{font-size:12px;color:var(--muted)}
.arrow{align-self:center;color:var(--primary);font-weight:700}
.fsm{display:flex;gap:8px;flex-wrap:wrap}
.fsm span{border:1px solid var(--line-strong);border-radius:8px;padding:5px 10px;font:600 12px var(--mono);background:#fff}
.fsm span.on{background:var(--primary);border-color:var(--primary);color:#fff}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.diag li{list-style:none;display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.diag{margin:0;padding:0}
.dev-card{display:flex;flex-direction:column;gap:10px}
.dev-card .ic{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.notice{border-radius:10px;padding:11px 14px;font-size:13.5px;background:var(--warn-soft);color:#7A3A06;border:1px solid #F1CBA3;display:flex;gap:10px;align-items:flex-start}
.notice.info{background:var(--primary-soft);color:#2C3590;border-color:#CBCEF3}
.notice svg{flex:none;margin-top:2px}
.daystrip{display:flex;gap:6px;flex-wrap:wrap}
.daystrip span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:600 11px var(--mono);background:#EFECE6;color:var(--muted)}
.daystrip span.p{background:var(--ok);color:#fff}.daystrip span.a{background:var(--warn-soft);color:#9A4508}
details.card summary{cursor:pointer;font-weight:650;font-size:16px}
details pre{background:#FCFBF9;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:12.5px/1.55 var(--mono);margin:12px 0 0}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:10px;padding:7px 11px;background:#fff;font-size:14px;cursor:pointer}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.foot-note{margin-top:28px;font-size:12.5px;color:var(--muted);text-align:center}
/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 20px 60px rgba(27,35,64,.25);color:var(--ink)}
dialog.wide{max-width:min(860px,95vw)}
dialog::backdrop{background:rgba(27,35,64,.45)}
.dlg-in{padding:24px;max-height:88vh;overflow:auto}
.dlg-in h2{font-size:20px;margin-bottom:8px}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 24px rgba(27,35,64,.3)}
.toast.ok{border-left:5px solid #3FC593}.toast.warn{border-left:5px solid #F2A04A}.toast.bad{border-left:5px solid #F27B70}.toast.info{border-left:5px solid #8D96F0}
/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.login{width:100%;max-width:440px}
.login .card{padding:28px}
.pw{position:relative}.pw .input{padding-right:46px}
.pw button{position:absolute;right:4px;top:4px;width:32px;height:32px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.pw button:hover{background:var(--primary-soft);color:var(--primary-dark)}
/* responsive */
@media (max-width:1180px){.daily-grid{grid-template-columns:1fr}.sticky{position:static}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:1023px){
  .sidebar{transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(27,35,64,.2)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(27,35,64,.4);z-index:30}
  .shell{margin-left:0}
  .topbar-m{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--side);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  main{padding:0 20px 40px}
  .kpis{grid-template-columns:1fr 1fr}.g2e{grid-template-columns:1fr}
}
@media (max-width:640px){
  main{padding:0 14px 36px}.page-head h1{font-size:23px}.card{padding:16px}.kpi .v{font-size:27px}
  .g3,.formgrid,.quick{grid-template-columns:1fr}.head-ctl{width:100%}.head-ctl .field{flex:1}
  .banner{padding:16px}.regs{grid-template-columns:repeat(9,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.sidebar,.topbar-m,#toasts{display:none}.shell{margin:0}}
</style>

<div id="root"></div>

<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* =====================================================================
   AttendEdge — Smart Attendance Management (FRONTEND PROTOTYPE)
   Faculty-only dashboard. All data is fictional and stored in this browser.
   Layers:  Service (data / API boundary)  ->  Calc (reports math)  ->  Views.
   To go live later, replace the bodies of the Service functions with
   fetch('/api/...') calls to a Flask + SQLite backend; the views stay unchanged.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- icons (inline, consistent 24px stroke set) ---------- */
const ICONS={
overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
daily:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 16l2 2 4-4"/>',
students:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.2 4.5 2 4.5 4.8"/>',
weekly:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',

/* ---------- date / time helpers (YYYY-MM-DD strings, UTC arithmetic: no DST drift) ---------- */
const D={
 parse:s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));},
 fmt:dt=>`${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`,
 add:(s,n)=>{const dt=D.parse(s);dt.setUTCDate(dt.getUTCDate()+n);return D.fmt(dt);},
 dow:s=>D.parse(s).getUTCDay(),
 valid:s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(D.parse(s)),
 range:(a,b)=>{const o=[];let d=a,i=0;while(d<=b&&i<900){o.push(d);d=D.add(d,1);i++;}return o;},
 weekStart:s=>D.add(s,-((D.dow(s)+6)%7)),
 long:s=>D.parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}),
 med:s=>D.parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}),
 short:s=>D.parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}),
 dayName:s=>D.parse(s).toLocaleDateString('en-GB',{weekday:'long',timeZone:'UTC'}),
 mon:(y,m)=>new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}),
 monShort:(y,m)=>new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-GB',{month:'short',timeZone:'UTC'}),
 monthRange:(y,m)=>[`${y}-${pad(m)}-01`,D.fmt(new Date(Date.UTC(y,m,0)))],
 firstMonday:s=>{let d=s;while(D.dow(d)!==1)d=D.add(d,1);return d;}
};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const toSec=t=>{const p=String(t).split(':').map(Number);return p[0]*3600+(p[1]||0)*60+(p[2]||0);};
const hms=sec=>`${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`;
const t12=t=>{const p=String(t).split(':').map(Number);const ap=p[0]>=12?'PM':'AM';return `${p[0]%12||12}:${pad(p[1]||0)}${p.length>2?':'+pad(p[2]):''} ${ap}`;};

function realNow(){

 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const g=t=>parts.find(p=>p.type===t).value;
 return {date:`${g('year')}-${g('month')}-${g('day')}`,time:`${g('hour')==='24'?'00':g('hour')}:${g('minute')}:${g('second')}`};
}

const FIRST=['Anika','Rohan','Meera','Kabir','Isha','Dev','Tara','Neel','Zoya'];
const LAST=['Verma','Nair','Iyer','Menon','Kulkarni','Bose','Rao'];
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rnd(seed){let t=(seed+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
function defaultSettings(){
 const n=realNow(),y=+n.date.slice(0,4),mo=+n.date.slice(5,7),second=mo>=7;
 const start=D.firstMonday(second?`${y}-08-01`:`${y}-01-01`);

  openingTime:'08:00',closingTime:'08:35',threshold:75,retentionYears:2,semesterStart:start,semesterEnd:D.add(start,125)};
}
function freshDB(){
 const settings=defaultSettings();
 DB={version:1,settings,students:[],sessions:{},records:{},events:[],ui:{selDate:today(),clock:{mode:'sim',time:'08:10:00'}}};
 for(let i=1;i<=63;i++){
  const f=FIRST[(i-1)%9],l=LAST[(i-1)%7];
  DB.students.push({id:'stu-'+pad(i),rollNumber:'25EV'+String(i).padStart(3,'0'),name:`${f} ${l}`,
   email:`${f}.${l}.${String(i).padStart(2,'0')}@example.edu`.toLowerCase(),department:settings.department,
   classSection:settings.classSection,semester:settings.semester,residence:defaultRes('25EV'+String(i).padStart(3,'0')),placeholder:true});
 }
 ensureHistory();save();
}
const RES=['Hosteller','Day Scholar'];
const defaultRes=roll=>rnd(hash32('res'+roll))<0.4?'Hosteller':'Day Scholar';
function baseProb(roll){return .64+.35*Math.sqrt(rnd(hash32('base'+roll)));}
function seedDay(date){
 const open=toSec(DB.settings.openingTime),close=toSec(DB.settings.closingTime);
 const rec={};
 DB.students.forEach(s=>{
  if(rnd(hash32(s.rollNumber+date+'p'))<baseProb(s.rollNumber)){
   const r=rnd(hash32(s.rollNumber+date+'t'));
   rec[s.rollNumber]={t:hms(open+5+Math.floor(Math.pow(r,1.5)*Math.max(10,close-open-40))),src:'seed'};
  }
 });
 DB.records[date]=rec;
 DB.sessions[date]={id:'ses-'+date,date,openingTime:DB.settings.openingTime,closingTime:DB.settings.closingTime,sessionStatus:'Closed'};
}
function ensureHistory(){
 const y=D.add(today(),-1),end=y<DB.settings.semesterEnd?y:DB.settings.semesterEnd;
 D.range(DB.settings.semesterStart,end).forEach(d=>{if(isWorkingDay(d)&&!DB.sessions[d])seedDay(d);});
}
function loadDB(){
 const s=readStore();
 if(s&&s.version===1&&Array.isArray(s.students)&&s.students.length===63){DB=s;DB.students.forEach(st=>{if(!RES.includes(st.residence))st.residence=defaultRes(st.rollNumber);});ensureHistory();save();}else freshDB();
}

/* ---------- calendar & session logic ---------- */
const holidayOf=d=>DB.settings.holidays.find(h=>h.date===d);
function isWorkingDay(d){return DB.settings.workingWeekdays.includes(D.dow(d))&&!holidayOf(d);}
function sessionTimes(d){
 if(d<today()&&DB.sessions[d])return {open:DB.sessions[d].openingTime,close:DB.sessions[d].closingTime};
 return {open:DB.settings.openingTime,close:DB.settings.closingTime};
}
/* RULE (used everywhere): a scan stamped at time t is accepted when  open <= t <= close,
   compared in whole seconds. Closing 08:35 means 08:35:00 is the last accepted instant;
   08:35:01 is "Attendance Closed". Before 08:00:00 is "Not Started". */
function windowState(t,times){const s=toSec(t);if(s<toSec(times.open))return 'notstarted';if(s<=toSec(times.close))return 'open';return 'closed';}
function sessionInfo(date){
 const n=clockNow(),times=sessionTimes(date);
 if(!isWorkingDay(date)){const h=holidayOf(date);return {key:'nonworking',label:'No session',reason:h?`${h.label} (holiday)`:`${D.dayName(date)} is not a working day`,times};}
 if(date<n.date)return {key:'closed',label:'Closed',reason:'Session finished',times};
 if(date>n.date)return {key:'notstarted',label:'Not Started',reason:'Upcoming working day',times};
 const w=windowState(n.time,times);
 return {key:w,label:w==='open'?'Open':w==='closed'?'Closed':'Not Started',times};
}
function completed(d){
 const n=clockNow();if(d<n.date)return true;if(d>n.date)return false;
 return windowState(n.time,sessionTimes(d))==='closed';
}
const recOn=d=>DB.records[d]||{};
const presentCount=d=>Object.keys(recOn(d)).length;
const logEvent=e=>{DB.events.unshift(Object.assign({id:'evt-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},e));DB.events=DB.events.slice(0,100);};

const Service={
 getStudent:roll=>DB.students.find(s=>s.rollNumber===roll),
 updateStudent(roll,patch){const s=Service.getStudent(roll);if(!s)return null;Object.assign(s,patch,{placeholder:false});save();return s;},
 scan(raw){
  const n=clockNow(),roll=String(raw||'').trim().toUpperCase(),stu=DB.students.find(s=>s.rollNumber===roll);
  let r;
  if(!stu)r={state:'invalid',message:`Invalid ID: ${roll||'(empty)'} is not on the roster. Nothing was recorded.`};
  else{
   const info=sessionInfo(n.date),tm=info.times;
   if(info.key==='nonworking')r={state:'closed',message:`Attendance Closed: ${info.reason}. Scan rejected.`};
   else if(info.key==='notstarted')r={state:'notstarted',message:`Not Started: scanning opens at ${t12(tm.open)}. Scan rejected.`};
   else if(info.key==='closed')r={state:'closed',message:`Attendance Closed: scanning ended at ${t12(tm.close)}. Scan rejected.`};
   else{
    const day=DB.records[n.date]=DB.records[n.date]||{};
    if(day[roll])r={state:'duplicate',message:`Already Present: ${stu.name} (${roll}, ${stu.residence}) was recorded at ${t12(day[roll].t)}. No second record created.`};
    else{
     day[roll]={t:n.time,src:'sim',ev:{scanner:'SIMULATOR',raw:roll,clock:DB.ui.clock.mode,at:new Date().toISOString()}};
     DB.sessions[n.date]=DB.sessions[n.date]||{id:'ses-'+n.date,date:n.date,openingTime:tm.open,closingTime:tm.close,sessionStatus:'Open'};
     r={state:'present',message:`Present Recorded: ${stu.name} (${roll}, ${stu.residence}) at ${t12(n.time)}. Register bit 0 → 1.`};
    }
   }
  }
  Object.assign(r,{roll,date:n.date,time:n.time});
  logEvent({date:n.date,time:n.time,roll:roll||'—',state:r.state,message:r.message});save();return r;
 },
 resetDay(date){
  if(date<today())return {ok:false,reason:'Historical records are protected and cannot be reset.'};
  const removed=presentCount(date);delete DB.records[date];
  logEvent({date,time:clockNow().time,roll:'—',state:'reset',message:`Demo day ${date} reset: ${removed} record(s) cleared.`});
  save();return {ok:true,removed};
 },
 saveSettings(patch){Object.assign(DB.settings,patch);ensureHistory();save();},
 resetAll(){try{localStorage.removeItem(STORE_KEY);}catch(e){}freshDB();},
 purgeOld(){
  const cut=D.add(today(),-365*DB.settings.retentionYears);let n=0;
  Object.keys(DB.records).forEach(d=>{if(d<cut){n+=presentCount(d);delete DB.records[d];}});
  Object.keys(DB.sessions).forEach(d=>{if(d<cut)delete DB.sessions[d];});
  save();return n;
 }
};

/* ---------- CALC: all report maths uses working-day calendar + recorded attendance ---------- */
const countedDays=(a,b)=>D.range(a,b).filter(d=>isWorkingDay(d)&&completed(d));
const scheduledDays=(a,b)=>D.range(a,b).filter(isWorkingDay);
function classStats(a,b){
 const days=countedDays(a,b),map={};
 DB.students.forEach(s=>{let p=0;days.forEach(d=>{if(recOn(d)[s.rollNumber])p++;});
  map[s.rollNumber]={working:days.length,present:p,absent:days.length-p,pct:days.length?p/days.length*100:null};});
 return {days,map};
}
function summarize(map){
 const v=Object.values(map).filter(x=>x.pct!==null);
 if(!v.length)return {avg:null,below:0,above:0};
 return {avg:v.reduce((a,x)=>a+x.pct,0)/v.length,below:v.filter(x=>x.pct<DB.settings.threshold).length,above:v.filter(x=>x.pct>=DB.settings.threshold).length};
}
function studentDays(roll,a,b){
 return D.range(a,b).map(d=>{
  const wk=isWorkingDay(d),done=completed(d),r=recOn(d)[roll];
  let status=!wk?'—':!done?'Pending':r?'Present':'Absent';
  return {date:d,wk,done,status,time:r?r.t:null,type:wk?'Working day':(holidayOf(d)?'Holiday: '+holidayOf(d).label:'Non-working day')};
 });
}

/* ---------- charts (inline SVG) ---------- */
function chart({type='bar',labels,values,max=100,unit='%',h=200,label='Chart'}){
 if(!values.some(v=>v!==null))return `<div class="empty"><b>No completed sessions in this period</b>Charts fill in once working days have finished.</div>`;
 const W=640,pl=36,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=h-pt-pb,n=values.length;
 const cx=i=>pl+iw/n*(i+.5),cy=v=>pt+ih*(1-Math.min(v,max)/max),step=Math.max(1,Math.ceil(n/8));
 let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(label)}">`;
 [0,.25,.5,.75,1].forEach(f=>{const y=pt+ih*(1-f);s+=`<line class="c-grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="c-axis" x="${pl-6}" y="${y+3}" text-anchor="end">${Math.round(max*f)}</text>`;});
 const val=v=>unit==='%'?v.toFixed(1)+'%':v;
 if(type==='bar'){
  const bw=Math.max(3,Math.min(34,iw/n*.62));
  values.forEach((v,i)=>{if(v===null)return;const y=cy(v);s+=`<rect class="c-bar${unit==='%'&&v<DB.settings.threshold?' low':''}" x="${(cx(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(pt+ih-y).toFixed(1)}" rx="3"><title>${esc(labels[i])}: ${val(v)}</title></rect>`;});
 }else{
  let d='',pen=false;
  values.forEach((v,i)=>{if(v===null){pen=false;return;}d+=`${pen?'L':'M'}${cx(i).toFixed(1)} ${cy(v).toFixed(1)} `;pen=true;});
  s+=`<path class="c-line" d="${d}"/>`;
  if(n<=45)values.forEach((v,i)=>{if(v!==null)s+=`<circle class="c-dot" cx="${cx(i).toFixed(1)}" cy="${cy(v).toFixed(1)}" r="3.2"><title>${esc(labels[i])}: ${val(v)}</title></circle>`;});
 }
 labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="c-axis" x="${cx(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`;});
 return s+'</svg>';
}

  data.sort((a,b)=>{const x=v(a),y=v(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
   return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*dir;});}
 const pages=size?Math.max(1,Math.ceil(data.length/size)):1;st.page=Math.min(Math.max(1,st.page),pages);
 const slice=size?data.slice((st.page-1)*size,st.page*size):data;
 if(!data.length)return empty||`<div class="empty"><b>No matching rows</b>Adjust the search or filters.</div>`;
 const head=cols.map(c=>{const on=st.sort===c.key;
  return `<th scope="col" class="${c.cls||''}" aria-sort="${on?(st.dir==='asc'?'ascending':'descending'):'none'}">${c.nosort?esc(c.label):`<button class="th-btn" data-act="sort" data-t="${id}" data-k="${c.key}">${esc(c.label)}${on?ic(st.dir==='asc'?'up':'down',13):''}</button>`}</th>`;}).join('');

 let pager='';
 if(size&&data.length>size){const a=(st.page-1)*size+1,b=Math.min(data.length,st.page*size);
  pager=`<div class="pager"><span>Showing ${a}–${b} of ${data.length}</span><span class="row"><button class="btn btn-sm" data-act="page" data-t="${id}" data-d="-1" ${st.page<=1?'disabled':''}>${ic('chevL',14)} Prev</button><span>Page ${st.page} of ${pages}</span><button class="btn btn-sm" data-act="page" data-t="${id}" data-d="1" ${st.page>=pages?'disabled':''}>Next ${ic('chevR',14)}</button></span></div>`;}
 else pager=`<div class="pager"><span>${data.length} row${data.length===1?'':'s'}</span></div>`;
 return `<div class="tbl-wrap"><table><caption class="sr">${esc(caption||'Data table')}</caption><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${pager}`;
}

const CLASS_COLS=['Roll number','Student name','Residence','Working days','Present','Absent','Attendance %'];
function meta(period,stu){const s=DB.settings,n=realNow();
 return [['Department',stu?stu.department:s.department],['Class / Section',stu?stu.classSection:s.classSection],...(stu?[['Residence',stu.residence]]:[]),['Semester',`${stu?stu.semester:s.semester} (AY ${s.academicYear})`],['Period',period],['Generated',`${D.med(n.date)}, ${t12(n.time)} (${s.timezone})`]];}
const classRows=map=>DB.students.map(s=>{const x=map[s.rollNumber];return [s.rollNumber,s.name,s.residence,x.working,x.present,x.absent,pctText(x.pct)];});
function classSummary(st){const sm=summarize(st.map);return [['Students',DB.students.length],['Working days counted',st.days.length],['Class average',pctText(sm.avg)],[`Below ${DB.settings.threshold}%`,sm.below],...resAvg(st.map).map(x=>[`${x.r} average (${x.n})`,pctText(x.avg)])];}
function studentSummary(days){const w=days.filter(x=>x.wk&&x.done),p=w.filter(x=>x.status==='Present').length;
 return [['Working days counted',w.length],['Present',p],['Absent',w.length-p],['Attendance %',pctText(w.length?p/w.length*100:null)]];}
const dayRowsOf=days=>days.map(x=>[D.short(x.date),x.type,x.status,x.time?t12(x.time):'—']);
const srcName=r=>r?(r.src==='sim'?'Simulated scanner':'Seeded demo data'):'—';
function listRows(date,present){return DB.students.filter(s=>!!recOn(date)[s.rollNumber]===present).map((s,i)=>{const r=recOn(date)[s.rollNumber];return [i+1,s.rollNumber,s.name,s.residence,present?t12(r.t):'Absent (0)'];});}
const resPresent=date=>RES.map(r=>{const g=DB.students.filter(s=>s.residence===r);return [`${r} present`,`${g.filter(s=>recOn(date)[s.rollNumber]).length} of ${g.length}`];});
const Reports={
 dailyStudent({roll,date}){
  const s=Service.getStudent(roll),info=sessionInfo(date),r=recOn(date)[roll];
  const status=info.key==='nonworking'?`No session (${info.reason})`:r?'Present (1)':completed(date)?'Absent (0)':'Absent (0), session not finished';
  return {file:`AttendEdge_daily_${roll}_${date}`,title:'Student daily attendance report',meta:meta(D.long(date),s),summary:[],columns:['Field','Value'],
   rows:[['Roll number',roll],['Student name',s.name],['Residence',s.residence],['Date',D.long(date)],['Session window',`${t12(info.times.open)} - ${t12(info.times.close)}`],['Status',status],['First scan time',r?t12(r.t):'—'],['Record source',srcName(r)]]};
 },
 weeklyStudent({roll,date}){
  const s=Service.getStudent(roll),ws=D.weekStart(date),we=D.add(ws,6),days=studentDays(roll,ws,we);
  return {file:`AttendEdge_weekly_${roll}_${ws}`,title:'Student weekly attendance report',meta:meta(`${D.med(ws)} to ${D.med(we)}`,s),summary:studentSummary(days),columns:['Date','Day type','Status','First scan time'],rows:dayRowsOf(days)};
 },
 monthlyStudent({roll,y,m}){
  const s=Service.getStudent(roll),[a,b]=D.monthRange(+y,+m),days=studentDays(roll,a,b);
  return {file:`AttendEdge_monthly_${roll}_${y}-${pad(m)}`,title:'Student monthly attendance report',meta:meta(D.mon(+y,+m),s),summary:studentSummary(days),columns:['Date','Day type','Status','First scan time'],rows:dayRowsOf(days)};
 },
 semesterStudent({roll}){
  const s=Service.getStudent(roll),a=DB.settings.semesterStart,b=DB.settings.semesterEnd,rows=[];
  let cy=+a.slice(0,4),cm=+a.slice(5,7);const ey=+b.slice(0,4),em=+b.slice(5,7);
  while(cy*12+cm<=ey*12+em){
   const [ma,mb]=D.monthRange(cy,cm),lo=ma<a?a:ma,hi=mb>b?b:mb,days=studentDays(roll,lo,hi),w=days.filter(x=>x.wk&&x.done),p=w.filter(x=>x.status==='Present').length;
   rows.push([D.mon(cy,cm),w.length,p,w.length-p,pctText(w.length?p/w.length*100:null)]);
   cm++;if(cm>12){cm=1;cy++;}
  }
  const all=studentDays(roll,a,b);
  return {file:`AttendEdge_semester_${roll}`,title:'Student semester attendance report',meta:meta(`${D.med(a)} to ${D.med(b)}`,s),summary:studentSummary(all),columns:['Month','Working days','Present','Absent','Attendance %'],rows};
 },
 dailyAll({date}){const tot=DB.students.length,pc=presentCount(date),rows=DB.students.map(s=>{const r=recOn(date)[s.rollNumber];return [s.rollNumber,s.name,s.residence,r?t12(r.t):'—',r?'Present (1)':'Absent (0)'];});
  return {file:`AttendEdge_daily_attendance_${date}`,title:'Daily attendance register',meta:meta(D.long(date)),summary:[['Present',pc],['Absent',tot-pc],['Attendance %',pctText(pc/tot*100)],...resPresent(date)],columns:['Roll number','Student name','Residence','Scan time','Status'],rows};},
 presentList({date}){const rows=listRows(date,true),tot=DB.students.length;
  return {file:`AttendEdge_present_${date}`,title:'Daily present list',meta:meta(D.long(date)),summary:[['Present',rows.length],['Absent',tot-rows.length],['Attendance %',pctText(rows.length/tot*100)],...resPresent(date)],columns:['#','Roll number','Student name','Residence','First scan time'],rows};},
 absentList({date}){const rows=listRows(date,false),tot=DB.students.length;
  return {file:`AttendEdge_absent_${date}`,title:'Daily absent list',meta:meta(D.long(date)),summary:[['Absent',rows.length],['Present',tot-rows.length],['Attendance %',pctText((tot-rows.length)/tot*100)],...resPresent(date)],columns:['#','Roll number','Student name','Residence','Status'],rows};},
 weeklyClass({date}){const ws=D.weekStart(date),we=D.add(ws,6),st=classStats(ws,we);
  return {file:`AttendEdge_weekly_class_${ws}`,title:'Weekly class attendance report',meta:meta(`${D.med(ws)} to ${D.med(we)}`),summary:classSummary(st),columns:CLASS_COLS,rows:classRows(st.map)};},
 monthlyClass({y,m}){const [a,b]=D.monthRange(+y,+m),st=classStats(a,b);
  return {file:`AttendEdge_monthly_class_${y}-${pad(m)}`,title:'Monthly report: all 63 students',meta:meta(D.mon(+y,+m)),summary:classSummary(st),columns:CLASS_COLS,rows:classRows(st.map)};},
 semesterClass(){const a=DB.settings.semesterStart,b=DB.settings.semesterEnd,st=classStats(a,b);
  return {file:`AttendEdge_semester_class_${DB.settings.academicYear}_S${DB.settings.semester}`,title:'Semester report: all 63 students',meta:meta(`${D.med(a)} to ${D.med(b)}`),summary:classSummary(st),columns:CLASS_COLS,rows:classRows(st.map)};}
};
function pdfArgs(name){const p=UI.pdf;
 return ({dailyStudent:{roll:p.student,date:p.day},weeklyStudent:{roll:p.student,date:p.week},monthlyStudent:{roll:p.student,y:p.y,m:p.m},semesterStudent:{roll:p.student},

const pdfSafe=s=>String(s==null?'':s).replace(/[—–]/g,'-').replace(/→/g,'->').replace(/…/g,'...');
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}
const csvCell=v=>{const s=String(v==null?'':v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};

function printReport(rep){

function exportPDF(rep){
 const J=window.jspdf&&window.jspdf.jsPDF;
 if(!J){toast('The PDF library did not load (offline?). Opening the print view instead: choose "Save as PDF".','warn');return printReport(rep);}
 try{
  const doc=new J({unit:'pt',format:'a4',orientation:rep.columns.length>5?'landscape':'portrait'});
  if(typeof doc.autoTable!=='function')throw new Error('autotable missing');
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=40;let y=48;
  doc.setFont('helvetica','bold');doc.setFontSize(21);doc.setTextColor(80,91,212);doc.text('AttendEdge',M,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(92,97,120);doc.text('Smart Attendance Management',M,y+14);
  doc.setDrawColor(214,208,196);doc.line(M,y+24,W-M,y+24);y+=50;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(27,35,64);doc.text(pdfSafe(rep.title),M,y);y+=19;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(60,65,85);
  rep.meta.forEach(m=>{doc.text(pdfSafe(`${m[0]}: ${m[1]}`),M,y);y+=13;});
  if(rep.summary.length){y+=5;doc.setFont('helvetica','bold');doc.setTextColor(27,35,64);
   const lines=doc.splitTextToSize(pdfSafe(rep.summary.map(s=>`${s[0]}: ${s[1]}`).join('   |   ')),W-2*M);doc.text(lines,M,y);y+=lines.length*13;}
  doc.autoTable({startY:y+8,head:[rep.columns.map(pdfSafe)],body:rep.rows.map(r=>r.map(pdfSafe)),styles:{fontSize:8.5,cellPadding:4,textColor:[27,35,64]},headStyles:{fillColor:[80,91,212],textColor:255},alternateRowStyles:{fillColor:[250,248,245]},margin:{left:M,right:M,bottom:40}});
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(92,97,120);doc.text('AttendEdge prototype | fictional demo data',M,H-22);doc.text(`Page ${i} of ${n}`,W-M,H-22,{align:'right'});}
  doc.save(rep.file+'.pdf');toast(`PDF downloaded: ${rep.file}.pdf`,'ok');
 }catch(e){console.error(e);toast('PDF generation failed. Opening the print view instead.','warn');printReport(rep);}
}
function runReport(name,args,mode){

 if(ae&&ae!==document.body&&root.contains(ae)){key=ae.id?`[id="${ae.id}"]`:(ae.dataset&&ae.dataset.bind?`[data-bind="${ae.dataset.bind}"]`:null);try{s0=ae.selectionStart;s1=ae.selectionEnd;}catch(e){}}
 const y=window.scrollY,view={overview:pageOverview,daily:pageDaily,students:pageStudents,weekly:pageWeekly,monthly:pageMonthly,semester:pageSemester,pdf:pagePdf,device:pageDevice,settings:pageSettings}[UI.page];
 root.innerHTML=`<a class="skip" href="#main">Skip to content</a>${sidebar()}<div class="shell"><div class="topbar-m"><button class="icon-btn" data-act="openNav" aria-label="Open navigation">${ic('menu',18)}</button><b>AttendEdge</b></div><main id="main" tabindex="-1">${header()}${view()}</main></div>`;
 UI.scan.flash=null;lastKey=statusKey();
 if(key){const el=$(key,root);if(el){el.focus({preventScroll:true});if(s0!=null)try{el.setSelectionRange(s0,s1);}catch(e){}}}
 window.scrollTo(0,y);
}
function route(){
 let h=location.hash.replace(/^#\/?/,'');
 if(!PAGES.some(p=>p[0]===h)){h='overview';history.replaceState(null,'','#/overview');}
 UI.page=h;document.body.classList.remove('nav-open');
 document.title='AttendEdge · '+PAGES.find(p=>p[0]===h)[1];
 render();window.scrollTo(0,0);
}
function setSel(v){if(!D.valid(v))return;DB.ui.selDate=v;save();render();}
function afterClock(){if(!UI.scan.busy){UI.scan.state='ready';UI.scan.message='Clock updated. Scanner ready.';}render();}

/* ---------- roster CSV ---------- */
function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\ufeff/,'');
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
  else if(ch==='"')q=true;else if(ch===','){r.push(c);c='';}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[];}else c+=ch;}
 if(c!==''||r.length){r.push(c);rows.push(r);}return rows.filter(x=>x.some(v=>v.trim()!==''));}
function importRoster(text){
 const rows=parseCSV(text);if(rows.length<2){toast('The file has no data rows.','bad');return;}
 const head=rows[0].map(h=>h.trim().toLowerCase()),ix=k=>head.indexOf(k.toLowerCase());
 if(ix('rollNumber')<0){toast('Missing "rollNumber" column. Export the roster CSV to see the expected format.','bad');return;}
 let up=0,unk=0,bad=0;
 rows.slice(1).forEach(r=>{
  const roll=(r[ix('rollNumber')]||'').trim().toUpperCase(),s=Service.getStudent(roll);
  if(!s){unk++;return;}
  const get=k=>ix(k)>=0?(r[ix(k)]||'').trim():null,p={},name=get('name'),email=get('email'),dep=get('department'),cls=get('classSection'),sem=get('semester'),res=get('residence');
  if(name)p.name=name;if(dep)p.department=dep;if(cls)p.classSection=cls;
  if(email){if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))p.email=email;else{bad++;return;}}
  if(sem){if(/^[1-8]$/.test(sem))p.semester=sem;else{bad++;return;}}
  if(res){const k=res.toLowerCase().replace(/[\s_-]/g,'');if(k==='hosteller'||k==='hostel')p.residence='Hosteller';else if(k==='dayscholar'||k==='day')p.residence='Day Scholar';else{bad++;return;}}
  if(Object.keys(p).length){Service.updateStudent(roll,p);up++;}
 });
 render();toast(`Roster import finished: ${up} updated, ${unk} unknown roll number(s) skipped, ${bad} invalid row(s) skipped.`,up?'ok':'warn');
}
function exportRoster(){
 const rows=[['rollNumber','name','email','department','classSection','semester','residence'],...DB.students.map(s=>[s.rollNumber,s.name,s.email,s.department,s.classSection,s.semester,s.residence])];
 download(new Blob(['\ufeff'+toCSV(rows)],{type:'text/csv;charset=utf-8'}),'AttendEdge_roster.csv');toast('Roster CSV downloaded.','ok');
}

/* ---------- actions ---------- */
const ACT={
 openNav(){document.body.classList.add('nav-open');}, closeNav(){document.body.classList.remove('nav-open');},
 logout(){try{localStorage.removeItem(AUTH_KEY);}catch(e){window.__authMem=false;}closeModal();render();history.replaceState(null,'','#/overview');toast('You have been logged out.','info');},
 sort(el){const st=T(el.dataset.t),k=el.dataset.k;if(st.sort===k)st.dir=st.dir==='asc'?'desc':'asc';else{st.sort=k;st.dir='asc';}render();},
 page(el){T(el.dataset.t).page+=+el.dataset.d;render();},
 setFilter(el){UI.daily.filter=el.dataset.f;T('daily').page=1;render();},
 goDaily(el){UI.daily.filter=el.dataset.f;UI.daily.q='';T('daily').page=1;if(location.hash==='#/daily')render();else location.hash='#/daily';},
 shiftDate(el){setSel(D.add(DB.ui.selDate,+el.dataset.d));},
 shiftWeek(el){UI.weekly.date=D.add(UI.weekly.date,+el.dataset.d);render();},
 scanPrefill(el){UI.scan.roll=el.dataset.roll;UI.scan.err='';UI.scan.state='ready';UI.scan.message=`${el.dataset.roll} loaded. Press Scan.`;render();const i=$('#scanRoll');if(i){i.scrollIntoView({block:'center',behavior:'smooth'});i.focus({preventScroll:true});}},
 pickRoll(el){ACT.scanPrefill(el);},
 preset(el){DB.ui.clock.time=el.dataset.t;save();toast(`Simulated clock set to ${el.dataset.t}.`,'info');afterClock();},
 clockMode(el){DB.ui.clock.mode=el.dataset.m;save();toast(el.dataset.m==='real'?'Using the system clock.':'Using the simulated clock.','info');afterClock();},
 openStudent(el){openModal(studentModal(el.dataset.roll),true);},
 report(el){const a=el.dataset.args;runReport(el.dataset.r,a==='pdf'?'pdf':(a?JSON.parse(a):null),el.dataset.mode||'pdf');},
 async resetDay(){const d=DB.ui.selDate;
  if(d<today()){toast('Historical records are protected and cannot be reset.','bad');return;}
  const ok=await confirmDialog({title:'Reset this demo day?',body:`This clears all ${presentCount(d)} attendance record(s) for <b>${esc(D.long(d))}</b> and sets every bit back to 0. Records for every other date are not touched.`,ok:'Reset demo day',danger:true});
  if(ok){const r=Service.resetDay(d);UI.scan.state='ready';UI.scan.message='Day reset. Scanner ready.';render();toast(`Demo day reset: ${r.removed} record(s) cleared.`,'ok');}},
 async resetAll(){const ok=await confirmDialog({title:'Reset all demo data?',body:'This deletes every demo attendance record, including seeded history and any roster edits, then recreates the original fictional data. It cannot be undone.',ok:'Reset all demo data',danger:true});
  if(ok){Service.resetAll();initUI();UI.tables={};render();toast('All demo data was reset.','ok');}},
 async purge(){const y=DB.settings.retentionYears,ok=await confirmDialog({title:'Delete expired records?',body:`This permanently deletes attendance records older than ${y} year${y>1?'s':''}. Newer records are kept.`,ok:'Delete expired records',danger:true});
  if(ok){const n=Service.purgeOld();render();toast(n?`${n} expired record(s) deleted.`:'No records are older than the retention period.',n?'ok':'info');}},
 rmHoliday(el){DB.settings.holidays=DB.settings.holidays.filter(h=>h.date!==el.dataset.d);Service.saveSettings({});render();toast('Holiday removed.','ok');},
 importRoster(){$('#rosterFile').click();}, exportRoster,
 dlgOk(){if(pendingConfirm){const r=pendingConfirm;pendingConfirm=null;r(true);}closeModal();},
 dlgCancel(){closeModal();},
 fillDemo(){$('#lu').value=DEMO_LOGIN.user;$('#lp').value=DEMO_LOGIN.pass;['luErr','lpErr','lgErr'].forEach(i=>$('#'+i).textContent='');$('#lp').focus();},
 togglePw(el){const i=$('#lp'),show=i.type==='password';i.type=show?'text':'password';el.setAttribute('aria-label',show?'Hide password':'Show password');el.setAttribute('aria-pressed',String(show));el.innerHTML=ic(show?'eyeoff':'eye',18);}
};
const FORMS={
 login(f){
  const u=f.elements.user.value.trim(),p=f.elements.pass.value,eu=$('#luErr'),ep=$('#lpErr'),eg=$('#lgErr');eu.textContent=ep.textContent=eg.textContent='';
  let bad=false;if(!u){eu.textContent='Enter your username.';bad=true;}if(!p){ep.textContent='Enter your password.';bad=true;}if(bad)return;
  if(u===DEMO_LOGIN.user&&p===DEMO_LOGIN.pass){try{localStorage.setItem(AUTH_KEY,JSON.stringify({user:u,demo:true,at:Date.now()}));}catch(e){window.__authMem=true;}route();toast('Signed in to the demo session.','ok');}
  else eg.textContent='Username or password not recognised. This prototype only accepts the labelled demo login.';
 },
 scan(){
  const sc=UI.scan;if(sc.busy)return;const roll=sc.roll.trim().toUpperCase();
  if(!roll){sc.err='Enter a roll number to scan.';render();return;}
  if(!/^[A-Z0-9]{3,12}$/.test(roll)){sc.err='Use 3 to 12 letters or digits only, for example 25EV001.';render();return;}
  sc.err='';sc.busy=true;sc.state='scanning';sc.message=`Reading barcode ${roll}…`;render();
  setTimeout(()=>{
   const r=Service.scan(roll);sc.busy=false;sc.state=r.state;sc.message=r.message;sc.lastRoll=roll;sc.roll=roll;if(r.state==='present')sc.flash=roll;
   let msg=r.message;if(r.state==='present'&&DB.ui.selDate!==r.date)msg+=` Recorded for today (${r.date}); you are viewing ${DB.ui.selDate}.`;
   toast(msg,({present:'ok',duplicate:'warn',invalid:'bad',closed:'bad',notstarted:'warn'})[r.state]);render();
  },450);
 },
 setTime(f){
  const v=f.elements.clk?f.elements.clk.value:$('#clk').value;
  if(!/^\d{2}:\d{2}(:\d{2})?$/.test(v)){toast('Enter a valid time.','bad');return;}
  DB.ui.clock.time=v.length===5?v+':00':v;save();toast(`Simulated clock set to ${DB.ui.clock.time}.`,'info');afterClock();
 },
 student(f){
  const g=id=>f.elements[id].value.trim(),err=$('#stuErr'),roll=f.dataset.roll;
  if(!g('name'))return void(err.textContent='Enter the student name.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g('email')))return void(err.textContent='Enter a valid email address.');
  if(!g('department')||!g('classSection'))return void(err.textContent='Department and class / section are required.');
  if(!/^[1-8]$/.test(g('semester')))return void(err.textContent='Semester must be a number from 1 to 8.');
  if(!RES.includes(g('residence')))return void(err.textContent='Choose Hosteller or Day Scholar.');
  Service.updateStudent(roll,{name:g('name'),email:g('email'),department:g('department'),classSection:g('classSection'),semester:g('semester'),residence:g('residence')});
  closeModal();render();toast(`Saved changes for ${roll}.`,'ok');
 },
 settings(f){
  const fd=new FormData(f),g=k=>String(fd.get(k)||'').trim(),err=m=>{$('#setErr').textContent=m;toast(m,'bad');};
  $('#setErr').textContent='';
  const open=g('openingTime'),close=g('closingTime'),wd=fd.getAll('wd').map(Number),thr=+g('threshold');
  if(!g('department')||!g('classSection'))return err('Department and class / section are required.');
  if(!/^\d{4}-\d{2}$/.test(g('academicYear')))return err('Academic year must look like 2026-27.');
  if(!D.valid(g('semesterStart'))||!D.valid(g('semesterEnd')))return err('Enter both semester dates.');
  if(g('semesterEnd')<=g('semesterStart'))return err('Semester end must be after semester start.');
  if(!/^\d{2}:\d{2}$/.test(open)||!/^\d{2}:\d{2}$/.test(close))return err('Enter both the opening and closing times.');
  if(toSec(close)<=toSec(open))return err('Closing time must be later than opening time.');
  if(!(thr>=1&&thr<=100))return err('The attendance target must be between 1 and 100.');
  if(!wd.length)return err('Select at least one working day.');
  const old=Object.assign({},DB.settings);
  DB.students.forEach(s=>{if(s.department===old.department)s.department=g('department');if(s.classSection===old.classSection)s.classSection=g('classSection');if(s.semester===old.semester)s.semester=g('semester');});
  Service.saveSettings({department:g('department'),classSection:g('classSection'),semester:g('semester'),academicYear:g('academicYear'),semesterStart:g('semesterStart'),semesterEnd:g('semesterEnd'),openingTime:open,closingTime:close,threshold:thr,retentionYears:+g('retentionYears'),timezone:g('timezone'),workingWeekdays:wd});
  UI.sem.sem=g('semester');UI.sem.ay=g('academicYear');render();toast('Settings saved. Reports now use the new calendar and window.','ok');
 },
 addHoliday(f){
  const d=f.elements.date.value,l=f.elements.label.value.trim(),e=$('#holErr');
  if(!D.valid(d))return void(e.textContent='Choose a date.');if(!l)return void(e.textContent='Enter a label.');
  if(DB.settings.holidays.some(h=>h.date===d))return void(e.textContent='That date is already a holiday.');
  DB.settings.holidays.push({date:d,label:l});DB.settings.holidays.sort((a,b)=>a.date.localeCompare(b.date));Service.saveSettings({});render();toast('Holiday added.','ok');
 }
};

/* ---------- wiring ---------- */
function tick(){
 if(!isAuthed()||DB.ui.clock.mode!=='real')return;
 const n=clockNow();$$('[data-clock]').forEach(e=>e.textContent=t12(n.time));
 const c=$('#clk');if(c&&document.activeElement!==c)c.value=n.time;
 if(statusKey()!==lastKey&&!$('#dlg').open)render();
}
function boot(){
 loadDB();initUI();
 document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const h=ACT[el.dataset.act];if(h){if(el.tagName==='A')e.preventDefault();h(el,e);}});
 document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form](f,e);});
 const DATEKEYS=['weekly.date','pdf.day','pdf.week','pdf.pDate','pdf.aDate'],NUM=['y','m','cy','cm','size'];
 document.addEventListener('input',e=>{
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;let v=el.value;
  if(b==='sel'){if(D.valid(v))setSel(v);return;}
  const [g,k]=b.split('.');if(!UI[g])return;
  if(DATEKEYS.includes(b)&&!D.valid(v))return;
  if(NUM.includes(k))v=+v;
  UI[g][k]=v;
  if(b==='scan.roll'){UI.scan.err='';if(!UI.scan.busy){UI.scan.state='ready';UI.scan.message='Scanner idle. Press Scan to read this roll number.';}}
  else if(g!=='pdf')Object.values(UI.tables).forEach(t=>t.page=1);
  render();
 });
 document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.file==='roster'){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importRoster(String(rd.result));rd.readAsText(f);el.value='';}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('nav-open');});
 const dlg=$('#dlg');
 dlg.addEventListener('click',e=>{if(e.target===dlg)closeModal();});
 dlg.addEventListener('close',()=>{if(pendingConfirm){const r=pendingConfirm;pendingConfirm=null;r(false);}});
 window.addEventListener('hashchange',route);
 route();setInterval(tick,1000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
